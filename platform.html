<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Saha CRM · Platform</title>
    <script>try{var t=localStorage.getItem('crm-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>html, body { margin: 0; background: #f6f8fa; } @media (prefers-color-scheme: dark) { html:not([data-theme=light]), html:not([data-theme=light]) body { background: #0d1117; } } html[data-theme=dark], html[data-theme=dark] body { background: #0d1117; }</style>
  </head>
  <body class="platform">
    <div id="root"></div>
    <script type="module" src="/src/platform/main.tsx"></script>
  </body>
</html>
