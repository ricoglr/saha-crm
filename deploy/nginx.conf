server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  client_max_body_size 25m;

  # API (accounts, sync, admin)
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $api http://saha-crm-api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store";
  }

  # Never cache the entry points, so updates reach phones right away
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~* ^/(registerSW\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; }
  # Hashed build files can be cached forever
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri /index.html; }
}
